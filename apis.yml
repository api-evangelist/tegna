aid: tegna
name: TEGNA
description: >-
  TEGNA Inc. is an American broadcast, digital media, and marketing services company headquartered in Tysons, Virginia,
  operating as a subsidiary of Nexstar Media Group following FCC approval of the $6.2 billion acquisition in March 2026.
  TEGNA operates 64 full-power broadcast television stations across 51 U.S. markets, reaching approximately 39 percent
  of all television households. Its digital marketing portfolio includes AudienceOne first-party data targeting, OTT/CTV
  advertising through the Premion platform, and the TEGNA Marketing Solutions full-service agency. TEGNA runs no public
  developer program and publishes no developer portal: those advertising products are transacted through insertion
  orders, programmatic deal IDs and agency contracts. The only publicly callable, machine-readable API surfaces TEGNA
  serves are the WordPress REST content APIs behind its corporate site and premion.com; the Premion advertising
  platform API at api.premion.com is live but token-gated and undocumented.

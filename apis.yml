  name: TEGNA Content API (WordPress REST)
  description: >-
    The public, unauthenticated read API behind www.tegna.com — TEGNA's corporate and press site. 264 routes across
    366 operations serving posts, pages, media, categories, tags, taxonomies, block types, site-health and the
    WordPress Abilities namespace as JSON, plus oEmbed and AIOSEO metadata. Verified live and callable on 2026-08-13.

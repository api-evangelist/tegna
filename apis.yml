- aid: tegna:tegna-premion-platform-api
  name: Premion Advertising Platform API (gated)
  description: >-
    A live but undocumented and token-gated API behind Premion's OTT/CTV advertising platform. Probed 2026-08-13:
    the host root returns 200 {"message":"App is running"}, /health returns 200, and every path under /api returns
    401 {"message":"Access Denied: No Token Provided"}. No OpenAPI, Swagger, GraphQL, docs or discovery document is
    served at any probed location. Recorded because the surface demonstrably exists; no specification is claimed.

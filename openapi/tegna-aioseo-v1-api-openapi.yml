openapi: 3.2.0
info:
  title: TEGNA Content API (WordPress REST) Aioseo/v1 API
  description: 'The public, unauthenticated read API behind www.tegna.com — TEGNA''s corporate and press site. Serves posts, pages, media, categories, tags, taxonomies, block types and site-health data as JSON, plus oEmbed and AIOSEO metadata namespaces. This is the only machine-readable, publicly callable API surface TEGNA serves: TEGNA publishes no developer portal and no advertising API. Reads require no credential; writes require a WordPress Application Password.'

openapi: 3.2.0
info:
  title: PREMION Content API (WordPress REST) Yoast/v1 API
  description: 'The public, unauthenticated read API behind premion.com — the marketing site for Premion, TEGNA''s OTT/CTV advertising business. Serves posts, pages, media, categories, taxonomies and block types as JSON, plus oEmbed and Yoast SEO metadata namespaces. It is NOT the Premion advertising platform API: that surface lives at https://api.premion.com/api, is token-gated (401 ''Access Denied: No Token Provided'') and publishes no specification. Reads here require no credential; writes require a WordPress Application Password.'
  version: '2.0'
  x-provenance:
    method: derived
    derived_by: API Evangelist enrichment pipeline
    derived_from: https://premion.com/wp-json/
    derived_on: '2026-08-13'
    note: 'DERIVED, not published by the provider. TEGNA does not publish an OpenAPI document. This specification is a faithful mechanical transform of the WordPress REST route-discovery index the provider serves at the URL above: every path, method, parameter name, type, enum, default and required flag is copied from that index. No operation, parameter or host is invented. The host was verified live and the routes verified callable on 2026-08-13.'

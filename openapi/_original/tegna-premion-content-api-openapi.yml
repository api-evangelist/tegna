components:
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress Application Passwords (HTTP Basic). The live index advertises the authorization
        endpoint at wp-admin/authorize-application.php. Reads on public content require no credential.
  schemas:
    Error:
      type: object
      description: WordPress REST error envelope, observed live on this host.
      properties:
        code:
          type: string
          description: Machine-readable error slug, e.g. `rest_no_route`.
        message:
          type: string
          description: Human-readable message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code, repeated in the body.
            params:
              type: object
              description: Per-parameter validation messages.
            details:
              type: object
              description: Per-parameter error codes.
      required:
      - code
      - message
      - data
